<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cifras — Ativar acesso</title>
<link rel="icon" type="image/svg+xml" href="/static/brand/favicon.svg">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#5b4b8a">
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #22263a;
  --text: #e8eaf0;
  --text-muted: #7b82a0;
  --accent: #6c8ef5;
  --border: #2c3050;
  --danger: #f87171;
  --success: #4ade80;
  --radius: 10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 48px 40px;
  width: min(440px, 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 28px;
  box-shadow: 0 24px 64px rgba(0,0,0,.4);
}

.logo { line-height: 1; }

.user-info {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 16px;
  width: 100%;
}
.user-info img {
  width: 36px; height: 36px;
  border-radius: 50%;
  flex-shrink: 0;
}
.user-info-text { font-size: 0.88em; }
.user-info-name { font-weight: 600; color: var(--text); }
.user-info-email { color: var(--text-muted); margin-top: 2px; }

.title {
  text-align: center;
  width: 100%;
}
.title h1 {
  font-size: 1.3em;
  font-weight: 700;
}
.title p {
  margin-top: 8px;
  font-size: 0.88em;
  color: var(--text-muted);
  line-height: 1.6;
}

.divider {
  width: 100%;
  height: 1px;
  background: var(--border);
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
}
.form-group label {
  font-size: 0.85em;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: .04em;
  text-transform: uppercase;
}
.form-group input {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-size: 1.05em;
  font-family: 'Courier New', monospace;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 13px 16px;
  width: 100%;
  transition: border-color .15s;
  outline: none;
}
.form-group input::placeholder {
  color: var(--text-muted);
  font-weight: 400;
  letter-spacing: .04em;
}
.form-group input:focus {
  border-color: var(--accent);
}

.btn-primary {
  width: 100%;
  padding: 14px 20px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-size: 0.95em;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-primary:hover { opacity: .9; }
.btn-primary:active { transform: scale(.98); }
.btn-primary:disabled { opacity: .5; cursor: not-allowed; }

.message {
  width: 100%;
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: 0.88em;
  display: none;
}
.message.error {
  background: rgba(248,113,113,.1);
  border: 1px solid rgba(248,113,113,.3);
  color: var(--danger);
}
.message.success {
  background: rgba(74,222,128,.1);
  border: 1px solid rgba(74,222,128,.3);
  color: var(--success);
}

.logout-link {
  font-size: 0.8em;
  color: var(--text-muted);
  text-decoration: none;
}
.logout-link:hover { color: var(--text); }

.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="/static/brand/logo-dark.svg" alt="My Cifras" height="40">
  </div>

  {% if user and user.email %}
  <div class="user-info">
    {% if user.picture %}
    <img src="{{ user.picture }}" alt="{{ user.name }}">
    {% endif %}
    <div class="user-info-text">
      <div class="user-info-name">{{ user.name or user.email }}</div>
      <div class="user-info-email">{{ user.email }}</div>
    </div>
  </div>
  {% endif %}

  <div class="title">
    <h1>Ativar acesso</h1>
    <p>Insira o código de acesso que você recebeu<br>para liberar o app.</p>
  </div>

  <div class="divider"></div>

  <div class="form-group">
    <label for="coupon-input">Código de acesso</label>
    <input id="coupon-input" type="text" placeholder="EX: BETA2025"
           autocomplete="off" spellcheck="false" maxlength="32">
  </div>

  <div id="msg" class="message"></div>

  <button id="btn-activate" class="btn-primary" disabled>
    <span class="spinner" id="spinner"></span>
    <span id="btn-text">Ativar</span>
  </button>

  <a href="/logout" class="logout-link">Entrar com outra conta</a>
</div>

<script>
var input  = document.getElementById("coupon-input");
var btn    = document.getElementById("btn-activate");
var msg    = document.getElementById("msg");
var spin   = document.getElementById("spinner");
var btnTxt = document.getElementById("btn-text");

input.addEventListener("input", function() {
  btn.disabled = input.value.trim().length === 0;
  msg.style.display = "none";
});

input.addEventListener("keydown", function(e) {
  if (e.key === "Enter" && !btn.disabled) activate();
});

btn.addEventListener("click", activate);

function activate() {
  var code = input.value.trim();
  if (!code) return;

  btn.disabled = true;
  spin.style.display = "block";
  btnTxt.textContent = "Ativando…";
  msg.style.display = "none";

  fetch("/api/redeem-coupon", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ code: code })
  })
  .then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
  .then(function(res) {
    if (res.ok) {
      showMsg("success", "Acesso ativado! Redirecionando…");
      setTimeout(function() { window.location.href = "/"; }, 1200);
    } else {
      showMsg("error", res.data.error || "Erro ao ativar.");
      btn.disabled = false;
      spin.style.display = "none";
      btnTxt.textContent = "Ativar";
    }
  })
  .catch(function() {
    showMsg("error", "Erro de conexão. Tente novamente.");
    btn.disabled = false;
    spin.style.display = "none";
    btnTxt.textContent = "Ativar";
  });
}

function showMsg(type, text) {
  msg.className = "message " + type;
  msg.textContent = text;
  msg.style.display = "block";
}
</script>
</body>
</html>
